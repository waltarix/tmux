name: Release

on:
  push:
    tags:
      - '[0-9]+.*-custom'
      - '[0-9]+.*-custom-r[0-9]+'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get install -y --no-install-recommends libevent-dev

    - name: Build
      run: ./autogen.sh && ./configure && make dist-xz

    - name: Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: '*.tar.xz'
